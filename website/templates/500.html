<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Instabilidade Temporária (500) | Barber Heitor</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
  <style>
    body {
      background-color: #06080d;
      color: #f8fafc;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 1.5rem;
    }
    .surface-card {
      background: #0d121c;
      border: 1px solid rgba(212, 175, 55, 0.3);
      border-radius: 12px;
      box-shadow: 0 16px 40px rgba(0, 0, 0, 0.7);
      max-width: 540px;
      width: 100%;
    }
    .btn-brand {
      background: linear-gradient(135deg, #f5e2ad 0%, #d4af37 50%, #aa8524 100%);
      color: #06080d;
      font-weight: 600;
      border: none;
    }
  </style>
</head>
<body>
  <div class="surface-card p-5 text-center">
    <div class="d-inline-flex p-3 rounded-circle bg-dark border border-danger border-opacity-30 mb-3 text-danger fs-1">
      <i class="bi bi-exclamation-octagon"></i>
    </div>
    <h1 class="display-1 text-danger fw-bold mb-2">500</h1>
    <h3 class="text-white mb-3">Instabilidade Temporária</h3>
    <p class="text-secondary small mb-4">
      Ocorreu uma falha inesperada no processamento da requisição. Nossos administradores já foram alertados. Por favor, tente novamente em instantes.
    </p>
    <div class="d-flex justify-content-center gap-2 flex-wrap">
      <a href="/" class="btn btn-brand px-4 py-2">
        <i class="bi bi-house-door me-1"></i> Ir Para o Início
      </a>
      <a href="javascript:location.reload()" class="btn btn-outline-light px-4 py-2">
        <i class="bi bi-arrow-clockwise me-1"></i> Recarregar Página
      </a>
    </div>
  </div>
</body>
</html>
