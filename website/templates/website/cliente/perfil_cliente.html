{% extends "website/modelo.html" %}
{% load crispy_forms_tags %}

{% block titulo %}Meu Perfil{% endblock %}

{% block conteudo %}
<section class="py-5">
  <div class="container py-4">
    <div class="row justify-content-center">
      <div class="col-lg-8">
        <div class="card surface-card p-4">
          <div class="d-flex justify-content-between align-items-center mb-4">
            <h2 class="section-title text-brand mb-0"><i class="bi bi-person-gear me-2"></i> Editar Perfil</h2>
            <a href="{% url 'area_cliente' %}" class="btn btn-outline-light btn-sm"><i class="bi bi-arrow-left me-1"></i> Voltar</a>
          </div>
          
          <form method="post" enctype="multipart/form-data">
            {% csrf_token %}
            {{ form|crispy }}
            <button type="submit" class="btn btn-brand w-100 mt-4 py-2">
              Salvar Alterações
            </button>
          </form>
        </div>
      </div>
    </div>
  </div>
</section>
{% endblock %}
